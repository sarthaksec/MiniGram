name: Build MiniGram Apps

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build MiniGram iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST_XCODE" ]; then
            LATEST_XCODE="/Applications/Xcode.app"
          fi
          echo "Selecting Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive (No Signing)
        run: |
          xcodebuild -project MiniGram.xcodeproj \
            -scheme MiniGram \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MiniGram.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/MiniGram.xcarchive/Products/Applications/MiniGram.app Payload/
          zip -r MiniGram.ipa Payload

      - name: Upload MiniGram IPA
        uses: actions/upload-artifact@v4
        with:
          name: MiniGram-iOS
          path: MiniGram.ipa
          retention-days: 14

  build-android:
    name: Build MiniGram Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload MiniGram APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniGram-Android
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
